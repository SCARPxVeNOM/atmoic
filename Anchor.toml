[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
atomic_perps = "8s677udBiKHkCNYzGEroenfN23k1vQjqR3JQvHjZcDWg"

[programs.mainnet]
atomic_perps = "8s677udBiKHkCNYzGEroenfN23k1vQjqR3JQvHjZcDWg"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# When running `anchor test`, spin up a local validator that mirrors the
# mainnet Kamino / Jupiter / Pyth programs + SOL/USD feed so our CPI path
# can be exercised against real on-chain state.
[test]
startup_wait = 10000
shutdown_wait = 2000

[test.validator]
url = "https://api.mainnet-beta.solana.com"

# Clone upgradeable programs from mainnet so CPIs can target real accounts.
[[test.validator.clone_upgradeable_program]]
address = "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"  # Kamino Lend

[[test.validator.clone_upgradeable_program]]
address = "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4"  # Jupiter v6

[[test.validator.clone_upgradeable_program]]
address = "rec5EKMGg6MxZYaMdyBfgwp4d5rB9T1VQH5pJv5LtFJ"  # Pyth Solana Receiver

# Clone the SOL/USD Pyth price update account so validate_and_get_price has data.
[[test.validator.clone]]
address = "7UVimffxr9ow1uXYxsr4LHAcV58mLzhmwaeKvJ1pjLiE"  # Pyth SOL/USD price update V2 on mainnet
